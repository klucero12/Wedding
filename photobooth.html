<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Adam & Kelvin · Photobooth</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Josefin+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{
  --cream:#faf7f2;--dark-green:#1a2f1a;--mid-green:#2d5a2d;
  --light-green:#4a7c4a;--sage:#8fae8f;--pale-sage:#d4e6d4;--gold:#b8965a;
}
html,body{height:100%;width:100%;background:var(--dark-green);font-family:'Josefin Sans',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;position:fixed;top:0;left:0}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;z-index:10;transition:opacity 0.4s ease}
.screen.hidden{opacity:0;pointer-events:none;z-index:1}

/* LEAF BG */
.leaf-bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.leaf-bg svg{position:absolute;opacity:0.12}

/* WELCOME */
.welcome-title{font-family:'Cormorant Garamond',serif;font-size:clamp(38px,9vw,64px);font-weight:300;font-style:italic;color:var(--cream);line-height:1;text-align:center}
.welcome-amp{color:var(--gold)}
.welcome-sub{font-size:clamp(9px,2.2vw,11px);letter-spacing:4px;text-transform:uppercase;color:var(--sage);margin-top:0.3rem;text-align:center}
.welcome-divider{width:50px;height:1px;background:var(--gold)}

.btn-primary{
  padding:clamp(14px,3.5vw,18px) clamp(32px,8vw,52px);
  border:1px solid var(--gold);color:var(--gold);background:transparent;
  font-family:'Josefin Sans',sans-serif;font-size:clamp(11px,3vw,13px);
  letter-spacing:4px;text-transform:uppercase;cursor:pointer;
  border-radius:2px;transition:all 0.3s;-webkit-appearance:none;
  -webkit-user-select:none;touch-action:manipulation;
}
.btn-primary:active{background:var(--gold);color:var(--dark-green)}
.btn-secondary{
  padding:clamp(10px,2.5vw,13px) clamp(20px,5vw,30px);
  border:1px solid rgba(143,174,143,0.4);color:var(--sage);background:transparent;
  font-family:'Josefin Sans',sans-serif;font-size:clamp(10px,2.5vw,11px);
  letter-spacing:3px;text-transform:uppercase;cursor:pointer;
  border-radius:2px;transition:all 0.3s;-webkit-appearance:none;
  touch-action:manipulation;
}
.btn-secondary:active{border-color:var(--sage);color:var(--cream)}

/* ERROR BOX */
.error-box{
  background:rgba(255,100,100,0.15);border:1px solid rgba(255,100,100,0.3);
  border-radius:4px;padding:1rem 1.25rem;color:#ffaaaa;
  font-size:clamp(11px,3vw,13px);letter-spacing:1px;line-height:1.7;
  text-align:center;max-width:320px;display:none;
}

/* CAMERA */
#camera-screen{padding:0;background:#000}
#video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;transform:scaleX(-1);
}
.camera-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(10,25,10,0.55) 0%,transparent 18%,transparent 72%,rgba(10,25,10,0.75) 100%);
  pointer-events:none;z-index:2;
}
.frame-corner{position:absolute;z-index:3;pointer-events:none;opacity:0.65}
.frame-corner.tl{top:10px;left:10px}
.frame-corner.tr{top:10px;right:10px;transform:scaleX(-1)}
.frame-corner.bl{bottom:10px;left:10px;transform:scaleY(-1)}
.frame-corner.br{bottom:10px;right:10px;transform:scale(-1)}
.camera-top{
  position:absolute;top:0;left:0;right:0;z-index:5;
  padding:clamp(10px,3vw,18px) clamp(14px,4vw,22px);
  display:flex;align-items:center;justify-content:space-between;
}
.cam-title{font-family:'Cormorant Garamond',serif;font-size:clamp(15px,4vw,20px);font-style:italic;color:var(--cream);font-weight:300}
.shot-counter{display:flex;gap:6px;align-items:center}
.shot-dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--sage);background:transparent;transition:all 0.3s}
.shot-dot.taken{background:var(--gold);border-color:var(--gold)}
.shot-dot.next{border-color:var(--cream);animation:pulseDot 1s ease-in-out infinite}
@keyframes pulseDot{0%,100%{transform:scale(1)}50%{transform:scale(1.35);background:rgba(250,247,242,0.3)}}
.strip-preview{
  position:absolute;bottom:clamp(95px,18vw,120px);left:0;right:0;z-index:5;
  display:flex;justify-content:center;gap:7px;padding:0 1rem;
}
.strip-thumb{
  width:clamp(50px,12vw,68px);aspect-ratio:3/4;
  border:1px solid rgba(143,174,143,0.4);border-radius:2px;
  overflow:hidden;background:rgba(0,0,0,0.35);
}
.strip-thumb img{width:100%;height:100%;object-fit:cover}
.strip-thumb.empty{display:flex;align-items:center;justify-content:center}
.strip-thumb.empty::after{content:'';width:1px;height:55%;background:rgba(143,174,143,0.3)}
.countdown-num{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;font-size:clamp(90px,28vw,160px);
  font-weight:300;color:rgba(255,255,255,0.92);z-index:6;pointer-events:none;
  opacity:0;transition:opacity 0.15s;text-shadow:0 4px 30px rgba(0,0,0,0.6);
}
.countdown-num.show{opacity:1}
.flash{position:absolute;inset:0;background:white;z-index:20;opacity:0;pointer-events:none}
.camera-bottom{
  position:absolute;bottom:0;left:0;right:0;z-index:5;
  padding:clamp(14px,3.5vw,22px);
  display:flex;align-items:center;justify-content:center;gap:2rem;
}
.shutter{
  width:clamp(72px,19vw,92px);height:clamp(72px,19vw,92px);
  border-radius:50%;border:3px solid var(--cream);
  background:rgba(255,255,255,0.12);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);position:relative;touch-action:manipulation;
}
.shutter::after{
  content:'';width:76%;height:76%;border-radius:50%;
  background:var(--cream);transition:all 0.12s;
}
.shutter:active::after{transform:scale(0.86);background:var(--pale-sage)}
.shutter.counting{pointer-events:none;border-color:var(--gold)}
.shutter.counting::after{background:var(--gold)}

/* STRIP SCREEN */
#strip-screen{overflow-y:auto;gap:1.25rem;padding:1.25rem 1rem 2rem}
.strip-title{font-family:'Cormorant Garamond',serif;font-size:clamp(20px,5.5vw,30px);font-style:italic;color:var(--cream);text-align:center;font-weight:300}
.strip-wrapper{
  position:relative;
  background:#0f2010;
  border-radius:4px;
  padding:0;
  display:flex;flex-direction:column;
  gap:0;
  width:min(240px,64vw);
  box-shadow:0 24px 70px rgba(0,0,0,0.7), 0 0 0 1px rgba(74,124,74,0.3);
  overflow:hidden;
}
.strip-header{
  position:relative;
  padding:clamp(10px,2.5vw,16px) clamp(12px,3vw,20px) clamp(8px,2vw,12px);
  text-align:center;
  background:linear-gradient(to bottom,rgba(20,50,20,0.9),rgba(15,32,16,0.7));
  overflow:hidden;
}
.strip-branch-l,.strip-branch-r{
  position:absolute;top:-6px;
  width:clamp(60px,16vw,90px);height:clamp(80px,20vw,120px);
  pointer-events:none;opacity:0.95;
}
.strip-branch-l{left:-8px}
.strip-branch-r{right:-8px}
.strip-header-name{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(15px,4vw,20px);
  font-style:italic;font-weight:400;
  color:#faf7f2;letter-spacing:2px;line-height:1.2;
  text-shadow:0 2px 12px rgba(0,0,0,0.5);
}
.strip-header-date{
  font-family:'Josefin Sans',sans-serif;
  font-size:clamp(6px,1.6vw,8px);
  letter-spacing:4px;text-transform:uppercase;
  color:#8fae8f;margin-top:3px;
}
.strip-photo{
  width:100%;aspect-ratio:3/4;object-fit:cover;display:block;
  border-top:2px solid #0f2010;
  border-bottom:2px solid #0f2010;
  position:relative;z-index:1;
}
/* monstera overlay between photos */
.strip-photo-wrap{position:relative}
.strip-divider-leaf{
  display:flex;align-items:center;justify-content:center;
  height:clamp(18px,4vw,26px);
  background:#0f2010;
  position:relative;overflow:hidden;
}
.strip-vine-l,.strip-vine-r{
  position:absolute;top:0;bottom:0;
  width:clamp(14px,3.5vw,20px);
  pointer-events:none;z-index:2;
}
.strip-vine-l{left:0}
.strip-vine-r{right:0}
.strip-footer{
  position:relative;
  padding:clamp(10px,2.5vw,16px) clamp(12px,3vw,20px);
  text-align:center;
  background:linear-gradient(to bottom,rgba(15,32,16,0.7),rgba(20,50,20,0.95));
  overflow:hidden;
}
.strip-corner-bl,.strip-corner-br{
  position:absolute;bottom:0;
  width:clamp(44px,11vw,65px);height:clamp(44px,11vw,65px);
  pointer-events:none;opacity:0.9;
}
.strip-corner-bl{left:0}
.strip-corner-br{right:0}
.strip-footer-inner{display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;z-index:2}
.strip-footer-loc{
  font-family:'Josefin Sans',sans-serif;
  font-size:clamp(6px,1.6vw,8px);
  letter-spacing:4px;text-transform:uppercase;
  color:#8fae8f;
}
.strip-floral-divider{display:flex;justify-content:center;margin-top:2px}
.action-row{display:flex;gap:0.6rem;flex-wrap:wrap;justify-content:center;width:100%;max-width:340px}

/* STATUS MSG */
.status-msg{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(26,47,26,0.92);border:1px solid var(--sage);
  border-radius:4px;padding:1rem 1.5rem;color:var(--pale-sage);
  font-size:13px;letter-spacing:2px;text-align:center;z-index:30;
  pointer-events:none;opacity:0;transition:opacity 0.3s;
}
.status-msg.show{opacity:1}

/* ── TABS ── */
.tab-row{display:flex;gap:0;border:1px solid rgba(143,174,143,0.3);border-radius:2px;overflow:hidden;margin-bottom:0.5rem}
.tab-btn{
  flex:1;padding:8px 20px;background:transparent;
  border:none;color:var(--sage);
  font-family:'Josefin Sans',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;
  cursor:pointer;transition:all 0.2s;
}
.tab-btn.active{background:rgba(143,174,143,0.18);color:var(--cream)}
.tab-btn:not(:last-child){border-right:1px solid rgba(143,174,143,0.3)}

/* ── CAROUSEL ── */
.carousel-wrap{
  width:min(72vw, 320px);
  aspect-ratio:3/4;
  overflow:hidden;
  border-radius:3px;
  position:relative;
  box-shadow:0 12px 40px rgba(0,0,0,0.4);
}
.carousel-track{
  display:flex;
  height:100%;
  transition:transform 0.38s cubic-bezier(0.4,0,0.2,1);
}
.carousel-slide{
  min-width:100%;height:100%;
  object-fit:cover;display:block;
  border-radius:3px;
}
.carousel-dots{display:flex;gap:7px;align-items:center;justify-content:center}
.carousel-dot{
  width:7px;height:7px;border-radius:50%;
  border:1px solid var(--sage);background:transparent;
  transition:all 0.25s;cursor:pointer;
}
.carousel-dot.active{background:var(--gold);border-color:var(--gold);transform:scale(1.2)}
.carousel-arrow{
  width:36px;height:36px;border-radius:50%;
  border:1px solid rgba(143,174,143,0.35);
  background:transparent;color:var(--sage);
  font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;-webkit-appearance:none;
}
.carousel-arrow:active{border-color:var(--gold);color:var(--gold)}

</style>
</head>

<script>
var stream=null, facingMode='user', photos=[], currentShot=0, isCounting=false;
var TOTAL=3;

document.addEventListener('DOMContentLoaded', function(){

  // ── IFRAME DETECTION ─────────────────────────
  // iOS Safari completely blocks camera inside iframes (Google Sites, etc.)
  // If we're embedded, show a "Open Full Screen" button instead
  var inIframe = false;
  try { inIframe = window.self !== window.top; } catch(e){ inIframe = true; }

  if(inIframe){
    var btn = document.getElementById('openBtn');
    btn.textContent = 'Open Photobooth ↗';
    btn.addEventListener('touchend', function(e){
      e.preventDefault();
      window.open(window.location.href, '_blank');
    });
    btn.addEventListener('click', function(e){
      e.preventDefault();
      window.open(window.location.href, '_blank');
    });
    // Show a small note
    var note = document.getElementById('iframeNote');
    if(note) note.style.display = 'block';
    return; // don't attach camera button
  }

  // ── NORMAL: attach camera button ─────────────
  var btn = document.getElementById('openBtn');
  btn.addEventListener('touchend', function(e){ e.preventDefault(); startCamera(); });
  btn.addEventListener('click', function(e){ e.preventDefault(); startCamera(); });

  var shutter = document.getElementById('shutterBtn');
  shutter.addEventListener('touchend', function(e){ e.preventDefault(); startCountdown(); });
  shutter.addEventListener('click', function(e){ e.preventDefault(); startCountdown(); });
});

// ── CAMERA ────────────────────────────────────
async function startCamera(){
  var errBox = document.getElementById('errorBox');
  errBox.style.display='none';

  // Must be HTTPS for camera on iOS
  if(location.protocol !== 'https:' && location.hostname !== 'localhost'){
    showError('Camera requires HTTPS.<br>Please open this page via a hosted URL (e.g. Netlify).');
    return;
  }

  // Check browser support
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showError('Camera not available.<br>Please open this page in <strong>Safari</strong> on iPhone/iPad or <strong>Chrome</strong> on Android.');
    return;
  }

  // iOS: check if permissions already denied
  if(navigator.permissions && navigator.permissions.query){
    try {
      var perm = await navigator.permissions.query({name:'camera'});
      if(perm.state === 'denied'){
        showError('Camera is blocked.<br>Go to <strong>Settings → Safari → Camera</strong> and set to Allow, then refresh.');
        return;
      }
    } catch(e){} // permissions API not supported on all browsers, continue anyway
  }

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:facingMode}, width:{ideal:1080}, height:{ideal:1440} },
      audio:false
    });
    onStreamReady();
  } catch(err1) {
    try {
      // Retry with minimal constraints
      stream = await navigator.mediaDevices.getUserMedia({ video:{facingMode:{ideal:facingMode}}, audio:false });
      onStreamReady();
    } catch(err2) {
      var msg;
      if(err2.name==='NotAllowedError'||err2.name==='PermissionDeniedError'){
        msg = '📷 Camera permission denied.<br><br>On iPhone/iPad:<br><strong>Settings → Safari → Camera → Allow</strong><br><br>Then close & reopen this page.';
      } else if(err2.name==='NotFoundError'){
        msg = 'No camera found on this device.';
      } else if(err2.name==='NotReadableError'){
        msg = 'Camera is busy.<br>Close other apps using the camera and try again.';
      } else if(err2.name==='AbortError'){
        msg = 'Camera start was interrupted.<br>Please try again.';
      } else {
        msg = 'Camera error: ' + (err2.message||err2.name) + '<br>Please try opening in Safari.';
      }
      showError(msg);
    }
  }
}

function onStreamReady(){
  var video = document.getElementById('video');
  video.srcObject = stream;
  video.onloadedmetadata = function(){ video.play(); };
  showScreen('camera-screen');
  photos=[];currentShot=0;
  buildShotCounter();buildStripPreview();
}

function showError(msg){
  var errBox = document.getElementById('errorBox');
  errBox.innerHTML = msg;
  errBox.style.display='block';
}

async function flipCamera(){
  facingMode = facingMode==='user' ? 'environment' : 'user';
  if(stream){ stream.getTracks().forEach(function(t){t.stop();}); }
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facingMode}},audio:false});
    var video=document.getElementById('video');
    video.srcObject=stream;
    video.style.transform = facingMode==='user' ? 'scaleX(-1)' : 'scaleX(1)';
  } catch(e){ facingMode=facingMode==='user'?'environment':'user'; }
}

// ── COUNTER + PREVIEW ─────────────────────────
function buildShotCounter(){
  var el=document.getElementById('shotCounter');
  el.innerHTML='';
  for(var i=0;i<TOTAL;i++){
    var d=document.createElement('div');
    d.className='shot-dot'+(i<photos.length?' taken':i===photos.length?' next':'');
    el.appendChild(d);
  }
}
function buildStripPreview(){
  var el=document.getElementById('stripPreview');
  el.innerHTML='';
  for(var i=0;i<TOTAL;i++){
    var d=document.createElement('div');
    d.className='strip-thumb'+(photos[i]?'':' empty');
    if(photos[i]){var img=document.createElement('img');img.src=photos[i];d.appendChild(img);}
    el.appendChild(d);
  }
}

// ── COUNTDOWN ─────────────────────────────────
function startCountdown(){
  if(isCounting||currentShot>=TOTAL) return;
  isCounting=true;
  document.getElementById('shutterBtn').classList.add('counting');
  var numEl=document.getElementById('countdownNum');
  var count=5;
  numEl.textContent=count;numEl.classList.add('show');
  var tick=setInterval(function(){
    count--;
    if(count>0){
      numEl.textContent=count;
      setTimeout(function(){numEl.classList.remove('show');setTimeout(function(){numEl.classList.add('show');},100);},700);
    } else {
      clearInterval(tick);
      numEl.classList.remove('show');
      setTimeout(capturePhoto, 300);
    }
  },1000);
}

function capturePhoto(){
  var video=document.getElementById('video');
  var canvas=document.getElementById('capture-canvas');
  var vw=video.videoWidth||640, vh=video.videoHeight||480;
  var ratio=3/4, srcW,srcH,srcX,srcY;
  if(vw/vh>ratio){srcH=vh;srcW=vh*ratio;srcX=(vw-srcW)/2;srcY=0;}
  else{srcW=vw;srcH=vw/ratio;srcX=0;srcY=(vh-srcH)/2;}
  canvas.width=600;canvas.height=800;
  var ctx=canvas.getContext('2d');
  if(facingMode==='user'){ctx.save();ctx.translate(600,0);ctx.scale(-1,1);}
  ctx.drawImage(video,srcX,srcY,srcW,srcH,0,0,600,800);
  if(facingMode==='user')ctx.restore();

  // flash
  var fl=document.getElementById('flash');
  fl.style.transition='none';fl.style.opacity='1';
  setTimeout(function(){fl.style.transition='opacity 0.3s';fl.style.opacity='0';},80);

  photos.push(canvas.toDataURL('image/jpeg',0.88));
  currentShot++;
  isCounting=false;
  document.getElementById('shutterBtn').classList.remove('counting');
  document.getElementById('countdownNum').classList.remove('show');
  buildShotCounter();buildStripPreview();
  if(currentShot>=TOTAL) setTimeout(buildFinalStrip,500);
}

// ── FINAL STRIP ───────────────────────────────
function buildFinalStrip(){
  // build carousel
  buildCarousel();

  // build strip photos
  var wrapper=document.getElementById('stripWrapper');
  wrapper.querySelectorAll('.strip-photo').forEach(function(e){e.remove();});
  var header=wrapper.querySelector('.strip-header');
  photos.forEach(function(src){
    var img=document.createElement('img');img.src=src;img.className='strip-photo';
    header.insertAdjacentElement('afterend',img);
  });

  // show carousel tab by default
  switchTab('photos');
  showScreen('strip-screen');
  if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}
  setTimeout(autoUploadStrip, 800);
}

// ── AUTO UPLOAD TO GOOGLE DRIVE ───────────────
async function autoUploadStrip(){
  var statusEl = document.getElementById('uploadStatus');
  statusEl.style.display = 'block';
  statusEl.style.opacity = '1';
  statusEl.style.transition = '';
  statusEl.style.color = 'var(--sage)';
  statusEl.textContent = 'Saving to wedding album...';

  try {
    var dataUrl = await renderStripCanvas();

    // Google Apps Script requires form data
    var formData = new FormData();
    formData.append('image', dataUrl);
    formData.append('name', 'photobooth-' + Date.now() + '.jpg');

    await fetch('https://script.google.com/macros/s/AKfycbx6SCcEQIolG0xSj3QIiBF9eXf-dBtTaaqN2y5_k7bVbOXl_zLmQ0dxHDzmco-ETszS/exec', {
      method: 'POST',
      mode: 'no-cors',
      body: formData
    });

    statusEl.textContent = 'Saved to Adam & Kelvin album!';
    statusEl.style.color = 'var(--pale-sage)';
    setTimeout(function(){
      statusEl.style.transition = 'opacity 1.5s';
      statusEl.style.opacity = '0';
    }, 3500);

  } catch(err) {
    statusEl.textContent = 'Auto-save failed — use Save button below';
    statusEl.style.color = 'rgba(255,150,150,0.8)';
  }
}

// ── SAVE ─────────────────────────────────────
async function saveStrip(){
  showStatus('Preparing…');
  var dataUrl=await renderStripCanvas();
  // iOS Safari: open in new tab, user saves via long-press
  if(/iPad|iPhone|iPod/.test(navigator.userAgent)){
    var w=window.open('','_blank');
    if(w){
      w.document.write('<html><head><meta name="viewport" content="width=device-width"></head><body style="margin:0;background:#1a2f1a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1rem"><img src="'+dataUrl+'" style="max-width:90vw;border-radius:4px"><p style="color:#d4e6d4;font-family:sans-serif;font-size:13px;letter-spacing:2px;text-align:center;padding:0 1rem">PRESS & HOLD IMAGE TO SAVE TO PHOTOS</p></body></html>');
      w.document.close();
    }
  } else {
    var a=document.createElement('a');a.href=dataUrl;a.download='adam-kelvin-photobooth.jpg';a.click();
  }
  hideStatus();
}

// ── SHARE ─────────────────────────────────────
async function shareStrip(){
  showStatus('Preparing…');
  var dataUrl=await renderStripCanvas();
  hideStatus();
  try {
    var res=await fetch(dataUrl);
    var blob=await res.blob();
    var file=new File([blob],'adam-kelvin-photobooth.jpg',{type:'image/jpeg'});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Adam & Kelvin · Wedding Photobooth',text:'Our photo strip from Adam & Kelvin\'s wedding! 🌿 May 23, 2026'});
      return;
    }
  } catch(e){}
  // Fallback
  saveStrip();
}

// ── RENDER CANVAS ─────────────────────────────
function renderStripCanvas(){
  return new Promise(function(resolve){
    var cw=640, ph=760, gap=6, headerH=100, footerH=88, pad=18;
    var ch = headerH + (ph+gap)*3 - gap + footerH;
    var c=document.createElement('canvas'); c.width=cw; c.height=ch;
    var ctx=c.getContext('2d');

    // DARK GREEN background
    ctx.fillStyle='#0f2010'; ctx.fillRect(0,0,cw,ch);

    // outer monstera border
    ctx.strokeStyle='rgba(45,107,45,0.5)'; ctx.lineWidth=3;
    ctx.strokeRect(4,4,cw-8,ch-8);
    ctx.strokeStyle='rgba(74,124,74,0.25)'; ctx.lineWidth=1;
    ctx.strokeRect(9,9,cw-18,ch-18);

    // ── HEADER ───────────────────────────────
    var hgrad=ctx.createLinearGradient(0,0,0,headerH);
    hgrad.addColorStop(0,'rgba(20,50,20,0.95)'); hgrad.addColorStop(1,'rgba(15,32,16,0.7)');
    ctx.fillStyle=hgrad; ctx.fillRect(0,0,cw,headerH);
    ctx.strokeStyle='rgba(45,107,45,0.3)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,headerH); ctx.lineTo(cw,headerH); ctx.stroke();

    // draw botanical branches top-left
    function drawBranch(ctx, x, y, flip){
      ctx.save();
      if(flip){ctx.translate(x*2,0);ctx.scale(-1,1);}
      ctx.strokeStyle='#2d5a2d'; ctx.lineWidth=1.6; ctx.globalAlpha=0.7;
      ctx.beginPath(); ctx.moveTo(x+60,y+95); ctx.quadraticCurveTo(x+40,y+55,x+28,y+30); ctx.quadraticCurveTo(x+18,y+15,x+10,y+2); ctx.stroke();
      // leaves
      function leaf(ax,ay,bx,by,cx,cy,op){
        ctx.beginPath(); ctx.moveTo(ax,ay); ctx.quadraticCurveTo(bx,by,cx,cy); ctx.quadraticCurveTo(bx+4,ay+4,ax,ay); ctx.closePath();
        ctx.fillStyle='#3a7a3a'; ctx.globalAlpha=op; ctx.fill();
      }
      leaf(x+28,y+30, x+8,y+22, x+2,y+10, 0.6);
      leaf(x+28,y+30, x+30,y+46, x+18,y+44, 0.45);
      leaf(x+42,y+55, x+22,y+48, x+14,y+36, 0.55);
      leaf(x+42,y+55, x+44,y+70, x+32,y+68, 0.4);
      leaf(x+18,y+15, x+4,y+10, x+2,y+2, 0.5);
      // berries
      ctx.globalAlpha=0.65;
      ctx.beginPath(); ctx.arc(x+10,y+3,3,0,Math.PI*2); ctx.fillStyle='#b8965a'; ctx.fill();
      ctx.beginPath(); ctx.arc(x+15,y+8,2,0,Math.PI*2); ctx.fillStyle='#b8965a'; ctx.fill();
      ctx.restore();
    }
    drawBranch(ctx, 12, 2, false);
    drawBranch(ctx, cw-72, 2, true);

    // draw monstera leaves in header corners
    ctx.globalAlpha=1;
    function drawMonstera(ctx, ox, oy, flip){
      ctx.save();
      if(flip){ ctx.translate(ox*2,0); ctx.scale(-1,1); }
      ctx.strokeStyle='#1a4a1a'; ctx.lineWidth=1.5; ctx.globalAlpha=0.9;
      ctx.beginPath(); ctx.moveTo(ox+60,oy+90); ctx.quadraticCurveTo(ox+35,oy+50,ox+18,oy+6); ctx.stroke();
      function mLeaf(ax,ay,bx,by,cx,cy,col,op){
        ctx.beginPath(); ctx.moveTo(ax,ay); ctx.quadraticCurveTo(bx,by,cx,cy); ctx.quadraticCurveTo(bx+3,ay+4,ax,ay); ctx.closePath();
        ctx.fillStyle=col; ctx.globalAlpha=op; ctx.fill();
        // vein
        ctx.beginPath(); ctx.moveTo(ax,ay); ctx.quadraticCurveTo((ax+cx)/2,(ay+cy)/2-4,cx,cy);
        ctx.strokeStyle='#1a4a1a'; ctx.lineWidth=0.6; ctx.globalAlpha=op*0.5; ctx.stroke();
      }
      mLeaf(ox+18,oy+6, ox+2,oy+0, ox-4,oy-10, '#2d6b2d',0.9);
      mLeaf(ox+18,oy+6, ox+32,oy+0, ox+36,oy-8, '#3a7a3a',0.8);
      mLeaf(ox+35,oy+50, ox+12,oy+40, ox+4,oy+28, '#255225',0.85);
      mLeaf(ox+35,oy+50, ox+50,oy+42, ox+54,oy+30, '#2d6b2d',0.7);
      ctx.globalAlpha=0.9;
      ctx.beginPath(); ctx.arc(ox+18,oy+6,3,0,Math.PI*2); ctx.fillStyle='#b8965a'; ctx.fill();
      ctx.restore();
    }
    drawMonstera(ctx, 8, 8, false);
    drawMonstera(ctx, cw-68, 8, true);

    // header text on dark bg
    ctx.globalAlpha=1;
    ctx.fillStyle='#faf7f2'; ctx.textAlign='center';
    ctx.font='italic 400 30px Georgia,serif';
    ctx.fillText('Adam & Kelvin', cw/2, 50);
    ctx.fillStyle='#8fae8f';
    ctx.font='300 11px sans-serif';
    ctx.fillText('MAY 23  ·  2026', cw/2, 70);
    [cw/2-30,cw/2,cw/2+30].forEach(function(x){
      ctx.beginPath(); ctx.arc(x,84,x===cw/2?3:2,0,Math.PI*2);
      ctx.fillStyle='rgba(184,150,90,'+(x===cw/2?'0.9':'0.6')+')'; ctx.fill();
    });

    // ── PHOTOS ───────────────────────────────
    var loaded=0;
    photos.forEach(function(src,i){
      var img=new Image();
      img.onload=function(){
        var py = headerH + i*(ph+gap);
        // thin green line between photos
        if(i>0){
          ctx.fillStyle='rgba(74,124,74,0.12)';
          ctx.fillRect(pad, py-gap, cw-pad*2, gap);
        }
        ctx.drawImage(img, pad, py, cw-pad*2, ph);

        // dark green side bars with monstera tint
        ctx.fillStyle='#0f2010';
        ctx.fillRect(0, py, pad, ph);
        ctx.fillRect(cw-pad, py, pad, ph);
        // tiny leaf marks on sides
        ctx.fillStyle='#2d6b2d'; ctx.globalAlpha=0.7;
        var leafY = py + ph/4;
        ctx.beginPath(); ctx.moveTo(pad,leafY); ctx.quadraticCurveTo(2,leafY-8,0,leafY-16); ctx.quadraticCurveTo(4,leafY-8,pad,leafY); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(cw-pad,leafY+ph/2); ctx.quadraticCurveTo(cw-2,leafY+ph/2-8,cw,leafY+ph/2-16); ctx.quadraticCurveTo(cw-4,leafY+ph/2-8,cw-pad,leafY+ph/2); ctx.closePath(); ctx.fill();
        ctx.globalAlpha=1;

        loaded++;
        if(loaded===photos.length){
          // ── FOOTER ───────────────────────────
          var fy = ch - footerH;
          var fgrad=ctx.createLinearGradient(0,fy,0,ch);
          fgrad.addColorStop(0,'rgba(15,32,16,0.7)'); fgrad.addColorStop(1,'rgba(20,50,20,0.95)');
          ctx.fillStyle=fgrad; ctx.fillRect(0,fy,cw,footerH);
          ctx.strokeStyle='rgba(45,107,45,0.3)'; ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(0,fy); ctx.lineTo(cw,fy); ctx.stroke();

          // botanical corner bottom-left
          function cornerLeaf(ctx, ox, oy, flip){
            ctx.save();
            if(flip){ctx.translate(ox*2,0);ctx.scale(-1,1);}
            ctx.strokeStyle='#2d5a2d'; ctx.lineWidth=1.1; ctx.globalAlpha=0.5;
            ctx.beginPath(); ctx.moveTo(ox+4,oy+72); ctx.quadraticCurveTo(ox+4,oy+40,ox+36,oy+8); ctx.stroke();
            function sm(ax,ay,bx,by,cx,cy,op){
              ctx.beginPath(); ctx.moveTo(ax,ay); ctx.quadraticCurveTo(bx,by,cx,cy); ctx.quadraticCurveTo(bx+2,ay+2,ax,ay); ctx.closePath();
              ctx.fillStyle='#4a7c4a'; ctx.globalAlpha=op; ctx.fill();
            }
            sm(ox+4,oy+50, ox-8,oy+42, ox-10,oy+32, 0.45);
            sm(ox+4,oy+50, ox+16,oy+46, ox+18,oy+36, 0.35);
            sm(ox+18,oy+28, ox+8,oy+18, ox+10,oy+10, 0.4);
            ctx.restore();
          }
          cornerLeaf(ctx, 8, fy+2, false);
          cornerLeaf(ctx, cw-44, fy+2, true);

          // floral divider line
          ctx.globalAlpha=1;
          var lx1=cw/2-80, lx2=cw/2-28;
          ctx.strokeStyle='rgba(143,174,143,0.6)'; ctx.lineWidth=0.7;
          ctx.beginPath(); ctx.moveTo(lx1,fy+22); ctx.lineTo(lx2,fy+22); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(cw-lx1,fy+22); ctx.lineTo(cw-lx2,fy+22); ctx.stroke();
          [cw/2-16,cw/2,cw/2+16].forEach(function(x,i){
            ctx.beginPath(); ctx.arc(x,fy+22,i===1?3:2,0,Math.PI*2);
            ctx.fillStyle='rgba(184,150,90,'+(i===1?'0.8':'0.55')+')'; ctx.fill();
          });
          // tiny leaves around center berry
          ctx.fillStyle='#4a7c4a'; ctx.globalAlpha=0.55;
          ctx.beginPath(); ctx.moveTo(cw/2,fy+19); ctx.quadraticCurveTo(cw/2-12,fy+15,cw/2-16,fy+19); ctx.quadraticCurveTo(cw/2-8,fy+21,cw/2,fy+19); ctx.closePath(); ctx.fill();
          ctx.beginPath(); ctx.moveTo(cw/2,fy+19); ctx.quadraticCurveTo(cw/2+12,fy+15,cw/2+16,fy+19); ctx.quadraticCurveTo(cw/2+8,fy+21,cw/2,fy+19); ctx.closePath(); ctx.fill();
          ctx.globalAlpha=1;

          ctx.fillStyle='#8fae8f'; ctx.textAlign='center';
          ctx.font='300 10px sans-serif';
          ctx.fillText('CHANDLER, TEXAS', cw/2, fy+42);
          ctx.fillStyle='rgba(184,150,90,0.7)';
          ctx.font='italic 300 9px Georgia,serif';
          ctx.fillText('with love · always', cw/2, fy+60);

          resolve(c.toDataURL('image/jpeg',0.93));
        }
      };
      img.src=src;
    });
  });
}

function showStatus(msg){
  var el=document.getElementById('statusMsg');
  if(el){el.textContent=msg;el.classList.add('show');}
}
function hideStatus(){
  var el=document.getElementById('statusMsg');
  if(el)el.classList.remove('show');
}
function retakeAll(){
  photos=[];currentShot=0;isCounting=false;
  if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}
  showScreen('welcome');
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(function(s){
    s.classList.toggle('hidden',s.id!==id);
  });
}

// ── CAROUSEL ─────────────────────────────────
var carouselIndex = 0;

function buildCarousel(){
  var track = document.getElementById('carouselTrack');
  var dots  = document.getElementById('carouselDots');
  track.innerHTML = '';
  dots.innerHTML  = '';
  photos.forEach(function(src, i){
    var img = document.createElement('img');
    img.src = src;
    img.className = 'carousel-slide';
    track.appendChild(img);
    var dot = document.createElement('div');
    dot.className = 'carousel-dot' + (i===0?' active':'');
    dot.onclick = (function(idx){ return function(){ goToSlide(idx); }; })(i);
    dots.appendChild(dot);
  });
  carouselIndex = 0;
  updateCarousel();
}

function goToSlide(idx){
  carouselIndex = Math.max(0, Math.min(photos.length-1, idx));
  updateCarousel();
}
function carouselNext(){ goToSlide(carouselIndex+1); }
function carouselPrev(){ goToSlide(carouselIndex-1); }

function updateCarousel(){
  var track = document.getElementById('carouselTrack');
  track.style.transform = 'translateX(-' + (carouselIndex*100) + '%)';
  document.getElementById('carouselCount').textContent = (carouselIndex+1) + ' / ' + photos.length;
  document.querySelectorAll('.carousel-dot').forEach(function(d,i){
    d.classList.toggle('active', i===carouselIndex);
  });
}

// swipe support
(function(){
  var startX=0, dragging=false;
  function onStart(e){ startX = e.touches ? e.touches[0].clientX : e.clientX; dragging=true; }
  function onEnd(e){
    if(!dragging) return; dragging=false;
    var endX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
    var diff = startX - endX;
    if(Math.abs(diff)>40){ diff>0 ? carouselNext() : carouselPrev(); }
  }
  document.addEventListener('DOMContentLoaded', function(){
    var wrap = document.querySelector('.carousel-wrap');
    if(wrap){
      wrap.addEventListener('touchstart', onStart, {passive:true});
      wrap.addEventListener('touchend', onEnd, {passive:true});
    }
  });
})();

function switchTab(tab){
  var showPhotos = tab==='photos';
  document.getElementById('carouselView').style.display = showPhotos ? 'flex' : 'none';
  document.getElementById('stripView').style.display    = showPhotos ? 'none' : 'flex';
  document.getElementById('tabPhotos').classList.toggle('active', showPhotos);
  document.getElementById('tabStrip').classList.toggle('active', !showPhotos);
}
